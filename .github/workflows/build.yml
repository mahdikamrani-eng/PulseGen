name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project around index.html
        run: |
          test -f index.html || { echo "index.html is missing from the repository root"; exit 1; }
          mkdir -p src/main/java/com/atro/pulse src/main/assets
          cp index.html src/main/assets/index.html

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PulseGen"
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2"
          }

          android {
              namespace = "com.atro.pulse"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.atro.pulse"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Pulse"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > src/main/java/com/atro/pulse/MainActivity.java <<'EOF'
          package com.atro.pulse;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Display;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setBackgroundColor(0xFF0F1115);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              // Ask Android for the highest refresh rate the panel supports at its current resolution.
              private void applyHighestRefreshRate() {
                  if (Build.VERSION.SDK_INT < 23) return;
                  Display d = getWindowManager().getDefaultDisplay();
                  Display.Mode cur = d.getMode();
                  Display.Mode best = cur;
                  for (Display.Mode m : d.getSupportedModes()) {
                      if (m.getPhysicalWidth() == cur.getPhysicalWidth()
                          && m.getPhysicalHeight() == cur.getPhysicalHeight()
                          && m.getRefreshRate() > best.getRefreshRate()) {
                          best = m;
                      }
                  }
                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  lp.preferredDisplayModeId = best.getModeId();
                  lp.preferredRefreshRate = best.getRefreshRate();
                  getWindow().setAttributes(lp);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideBars();
                      applyHighestRefreshRate();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  applyHighestRefreshRate();
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  super.onPause();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: build/outputs/apk/debug/*.apk

      - name: Publish APK as a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pulse v${{ github.run_number }}
          files: build/outputs/apk/debug/*.apk
